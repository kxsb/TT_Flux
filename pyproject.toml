[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttflux"
version = "0.1.3"
description = "Pipeline local et mesurable d'analyse vidéo de tennis de table"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "numpy>=2.5,<3",
    "opencv-python>=5.0,<6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[project.scripts]
ttflux = "ttflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttflux = [
    "web/templates/*.html",
    "web/static/*.css"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
